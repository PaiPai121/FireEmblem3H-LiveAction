<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#101820"/>
  <text x="64" y="86" fill="#f5f7fb" font-size="42" font-weight="900">SH001 · START · 剑花引题</text>
  <text x="64" y="152" fill="#d9e2ef" font-size="28">女贝老师站立持木剑起势；不要地面标线，不要红端点。</text>
  <rect x="90" y="230" width="1100" height="250" rx="18" fill="#1d2a36" stroke="#6d8194" stroke-width="3"/>
  <text x="130" y="330" fill="#f5f7fb" font-size="34">动作链：起势 → 剑花一百八十度掉头 → 收势发问</text>
  <text x="130" y="395" fill="#f5d47a" font-size="30">台词：今天我们不练普通挥剑。我们考虑一个新问题……</text>
</svg>
