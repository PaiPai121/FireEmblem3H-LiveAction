<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <rect width="1200" height="1800" fill="#f6f4ef"/>
  <style>
    .grid { stroke: #d4cec4; stroke-width: 2; }
    .major { stroke: #9b8f80; stroke-width: 4; }
    .label { font-family: Arial, sans-serif; font-size: 28px; fill: #3d3934; }
    .small { font-family: Arial, sans-serif; font-size: 22px; fill: #5b544c; }
    .body { fill: #88827b; stroke: #403b36; stroke-width: 5; }
    .joint { fill: #2f7d8c; opacity: 0.88; }
    .line { stroke: #2f7d8c; stroke-width: 5; stroke-dasharray: 18 12; }
  </style>

  <!-- Reference box: 6.8 heads tall, top 160, bottom 1520, head unit 200px. -->
  <line x1="120" y1="160" x2="1080" y2="160" class="major"/>
  <line x1="120" y1="360" x2="1080" y2="360" class="grid"/>
  <line x1="120" y1="560" x2="1080" y2="560" class="grid"/>
  <line x1="120" y1="760" x2="1080" y2="760" class="grid"/>
  <line x1="120" y1="960" x2="1080" y2="960" class="grid"/>
  <line x1="120" y1="1160" x2="1080" y2="1160" class="grid"/>
  <line x1="120" y1="1360" x2="1080" y2="1360" class="grid"/>
  <line x1="120" y1="1520" x2="1080" y2="1520" class="major"/>

  <text x="135" y="150" class="label">0 heads: top of head</text>
  <text x="135" y="352" class="small">1 head: chin / neck base</text>
  <text x="135" y="552" class="small">2 heads: chest / lower ribs</text>
  <text x="135" y="752" class="small">3 heads: waist / navel region</text>
  <text x="135" y="952" class="label">4 heads: hip/crotch near body midpoint</text>
  <text x="135" y="1152" class="small">5 heads: upper lower-leg zone</text>
  <text x="135" y="1352" class="label">6 heads: knees-to-shin transition</text>
  <text x="135" y="1548" class="label">6.8 heads: soles / ground</text>

  <!-- Central plumb line. -->
  <line x1="600" y1="130" x2="600" y2="1565" stroke="#c04f3f" stroke-width="3" stroke-dasharray="12 12"/>

  <!-- Neutral front female silhouette, non-sexual, realistic 6.8-head standing proportion. -->
  <!-- Head and neck -->
  <ellipse cx="600" cy="255" rx="82" ry="96" class="body"/>
  <rect x="570" y="340" width="60" height="60" rx="20" class="body"/>

  <!-- Torso -->
  <path class="body" d="M500 410
    C535 386, 665 386, 700 410
    C724 520, 718 660, 678 815
    C642 842, 558 842, 522 815
    C482 660, 476 520, 500 410Z"/>

  <!-- Pelvis -->
  <path class="body" d="M520 805
    C560 780, 640 780, 680 805
    C704 865, 690 945, 650 980
    C620 997, 580 997, 550 980
    C510 945, 496 865, 520 805Z"/>

  <!-- Arms -->
  <path class="body" d="M500 430 C455 500, 435 660, 425 820 C420 900, 405 990, 383 1070 C374 1105, 412 1116, 428 1082 C466 1003, 483 912, 490 824 C500 675, 520 542, 540 440Z"/>
  <path class="body" d="M700 430 C745 500, 765 660, 775 820 C780 900, 795 990, 817 1070 C826 1105, 788 1116, 772 1082 C734 1003, 717 912, 710 824 C700 675, 680 542, 660 440Z"/>

  <!-- Legs -->
  <path class="body" d="M540 965
    C570 950, 595 955, 604 985
    C612 1110, 602 1250, 585 1410
    C577 1475, 552 1505, 510 1505
    C483 1505, 474 1488, 488 1465
    C518 1418, 523 1300, 520 1180
    C518 1085, 520 1010, 540 965Z"/>
  <path class="body" d="M660 965
    C630 950, 605 955, 596 985
    C588 1110, 598 1250, 615 1410
    C623 1475, 648 1505, 690 1505
    C717 1505, 726 1488, 712 1465
    C682 1418, 677 1300, 680 1180
    C682 1085, 680 1010, 660 965Z"/>

  <!-- Landmark guide lines -->
  <line x1="440" y1="430" x2="760" y2="430" class="line"/>
  <text x="780" y="438" class="label">shoulder line</text>
  <line x1="490" y1="760" x2="710" y2="760" class="line"/>
  <text x="730" y="768" class="label">waist</text>
  <line x1="475" y1="960" x2="725" y2="960" class="line"/>
  <text x="745" y="968" class="label">hip / crotch midpoint</text>
  <line x1="470" y1="1238" x2="730" y2="1238" class="line"/>
  <text x="750" y="1246" class="label">knee center zone</text>
  <line x1="470" y1="1520" x2="730" y2="1520" class="line"/>
  <text x="750" y="1528" class="label">soles / ground</text>

  <circle cx="600" cy="430" r="12" class="joint"/>
  <circle cx="600" cy="760" r="12" class="joint"/>
  <circle cx="600" cy="960" r="12" class="joint"/>
  <circle cx="535" cy="1238" r="12" class="joint"/>
  <circle cx="665" cy="1238" r="12" class="joint"/>

  <text x="120" y="1660" class="label">Generation lock: match these landmarks, not fashion/hero 8-head proportions.</text>
  <text x="120" y="1700" class="small">For 女贝老师: head not tiny; hips near midpoint; knees midway from hip to soles; boots modest; no cape hiding landmarks.</text>
</svg>
