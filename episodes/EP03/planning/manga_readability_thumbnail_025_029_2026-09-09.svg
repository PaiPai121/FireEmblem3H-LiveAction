<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Five-panel action thumbnail: cause, pressure, intervention, bind, consequence. -->
  <rect width="1600" height="900" fill="#171a1d"/>
  <text x="50" y="42" fill="#f2eee7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">EP03 / 025–029 READABILITY REBOARD</text>
  <text x="50" y="70" fill="#8c9aa3" font-family="Arial, sans-serif" font-size="14">TASK → OBSTACLE → ACTION → REACTION → CHANGED STATE</text>

  <!-- Panel 025 -->
  <g transform="translate(50 105)">
    <rect width="470" height="330" rx="4" fill="#22282d" stroke="#5b6870" stroke-width="2"/>
    <text x="18" y="28" fill="#f3d6a0" font-family="Arial, sans-serif" font-size="18" font-weight="700">025  SPLIT THE FORK</text>
    <path d="M20 270 C130 225 220 255 450 185" fill="none" stroke="#69757b" stroke-width="20"/>
    <path d="M180 270 C240 235 290 160 430 110" fill="none" stroke="#69757b" stroke-width="14"/>
    <path d="M235 300 L235 160" stroke="#39454c" stroke-width="18"/>
    <path d="M315 225 L385 165" stroke="#bc6f53" stroke-width="8"/>
    <path d="M350 210 L420 150" stroke="#bc6f53" stroke-width="8"/>
    <circle cx="80" cy="225" r="18" fill="#52789a"/><circle cx="120" cy="205" r="18" fill="#52789a"/>
    <rect x="68" y="243" width="24" height="42" fill="#52789a"/><rect x="108" y="223" width="24" height="42" fill="#52789a"/>
    <circle cx="184" cy="235" r="17" fill="#688ca5"/><rect x="172" y="252" width="24" height="42" fill="#688ca5"/>
    <circle cx="423" cy="95" r="14" fill="#b99a63"/><rect x="413" y="109" width="20" height="32" fill="#b99a63"/>
    <path d="M205 210 Q250 170 305 180" fill="none" stroke="#e8c26d" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="300" y="306" fill="#d8e0e3" font-family="Arial, sans-serif" font-size="13">near cover / guard screen / far ridge</text>
  </g>

  <!-- Panel 026 -->
  <g transform="translate(565 105)">
    <rect width="470" height="330" rx="4" fill="#22282d" stroke="#5b6870" stroke-width="2"/>
    <text x="18" y="28" fill="#f3d6a0" font-family="Arial, sans-serif" font-size="18" font-weight="700">026  REFUSE THE SHOT</text>
    <path d="M20 262 C120 255 205 245 450 180" fill="none" stroke="#69757b" stroke-width="20"/>
    <path d="M205 240 L360 190" stroke="#bc6f53" stroke-width="10"/>
    <circle cx="390" cy="95" r="14" fill="#b99a63"/><rect x="380" y="109" width="20" height="32" fill="#b99a63"/>
    <circle cx="110" cy="180" r="18" fill="#5d9a93"/><rect x="98" y="198" width="24" height="48" fill="#5d9a93"/>
    <path d="M128 205 Q180 195 235 218" fill="none" stroke="#d9e4e4" stroke-width="4"/>
    <path d="M235 218 L240 262" stroke="#e2ba68" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="260" cy="235" r="15" fill="#bc6f53"/><rect x="250" y="250" width="20" height="36" fill="#bc6f53"/>
    <circle cx="310" cy="215" r="15" fill="#bc6f53"/><rect x="300" y="230" width="20" height="36" fill="#bc6f53"/>
    <path d="M255 288 Q190 302 135 286" fill="none" stroke="#e2ba68" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="245" y="310" fill="#d8e0e3" font-family="Arial, sans-serif" font-size="13">arrow lands on empty mud, not a body</text>
  </g>

  <!-- Panel 027 -->
  <g transform="translate(1080 105)">
    <rect width="470" height="330" rx="4" fill="#22282d" stroke="#5b6870" stroke-width="2"/>
    <text x="18" y="28" fill="#f3d6a0" font-family="Arial, sans-serif" font-size="18" font-weight="700">027  GUARD MOVES FIRST</text>
    <path d="M30 270 C140 230 240 245 450 160" fill="none" stroke="#69757b" stroke-width="20"/>
    <circle cx="390" cy="85" r="14" fill="#b99a63"/><rect x="380" y="99" width="20" height="32" fill="#b99a63"/>
    <circle cx="100" cy="210" r="17" fill="#5d9a93"/><rect x="88" y="227" width="24" height="45" fill="#5d9a93"/>
    <circle cx="226" cy="190" r="16" fill="#bc6f53"/><rect x="216" y="206" width="22" height="44" fill="#bc6f53"/>
    <path d="M235 220 L125 210" stroke="#d59b73" stroke-width="7" marker-end="url(#arrow)"/>
    <circle cx="155" cy="120" r="18" fill="#d3a24d"/><rect x="143" y="138" width="24" height="52" fill="#d3a24d"/>
    <path d="M165 165 Q195 185 210 205" fill="none" stroke="#f0d06c" stroke-width="6" marker-end="url(#arrow)"/>
    <circle cx="290" cy="220" r="15" fill="#bc6f53"/><rect x="280" y="235" width="20" height="36" fill="#bc6f53"/>
    <path d="M290 220 Q315 240 340 232" fill="none" stroke="#e2ba68" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="245" y="310" fill="#d8e0e3" font-family="Arial, sans-serif" font-size="13">Catherine owns the half-step</text>
  </g>

  <!-- Panel 028 -->
  <g transform="translate(305 500)">
    <rect width="470" height="330" rx="4" fill="#22282d" stroke="#5b6870" stroke-width="2"/>
    <text x="18" y="28" fill="#f3d6a0" font-family="Arial, sans-serif" font-size="18" font-weight="700">028  PROTECTIVE BIND</text>
    <path d="M35 270 C145 230 270 250 445 180" fill="none" stroke="#69757b" stroke-width="20"/>
    <circle cx="140" cy="155" r="18" fill="#d3a24d"/><rect x="128" y="173" width="24" height="52" fill="#d3a24d"/>
    <circle cx="320" cy="145" r="18" fill="#b99a63"/><rect x="308" y="163" width="24" height="54" fill="#b99a63"/>
    <circle cx="370" cy="190" r="15" fill="#bc6f53"/><rect x="360" y="205" width="20" height="38" fill="#bc6f53"/>
    <circle cx="405" cy="170" r="15" fill="#bc6f53"/><rect x="395" y="185" width="20" height="38" fill="#bc6f53"/>
    <path d="M382 192 Q352 175 337 175" fill="none" stroke="#e2ba68" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M308 190 L184 178" stroke="#e0e6e8" stroke-width="7"/>
    <path d="M160 178 L285 190" stroke="#e2ba68" stroke-width="7"/>
    <circle cx="245" cy="184" r="12" fill="#f5d27a" stroke="#f7f1c0" stroke-width="3"/>
    <path d="M320 215 Q300 245 250 260" fill="none" stroke="#e2ba68" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="18" y="310" fill="#d8e0e3" font-family="Arial, sans-serif" font-size="13">guard retreat causes Lonato to cross; one weapon contact</text>
  </g>

  <!-- Panel 029 -->
  <g transform="translate(820 500)">
    <rect width="470" height="330" rx="4" fill="#22282d" stroke="#5b6870" stroke-width="2"/>
    <text x="18" y="28" fill="#f3d6a0" font-family="Arial, sans-serif" font-size="18" font-weight="700">029  COST OF THE STOP</text>
    <path d="M25 270 C150 235 275 250 445 185" fill="none" stroke="#69757b" stroke-width="20"/>
    <line x1="180" y1="235" x2="255" y2="250" stroke="#bfc7ca" stroke-width="8"/>
    <circle cx="215" cy="160" r="18" fill="#b99a63"/><rect x="203" y="178" width="24" height="28" fill="#b99a63"/>
    <path d="M205 205 Q190 235 220 245" fill="none" stroke="#b99a63" stroke-width="8"/>
    <circle cx="95" cy="195" r="16" fill="#e0ba6a"/><rect x="85" y="211" width="20" height="43" fill="#e0ba6a"/>
    <circle cx="325" cy="140" r="16" fill="#52789a"/><rect x="315" y="156" width="20" height="45" fill="#52789a"/>
    <circle cx="390" cy="105" r="16" fill="#5d9a93"/><rect x="380" y="121" width="20" height="45" fill="#5d9a93"/>
    <circle cx="430" cy="75" r="16" fill="#6f8190"/><rect x="420" y="91" width="20" height="45" fill="#6f8190"/>
    <path d="M315 198 L250 190" fill="none" stroke="#e2ba68" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M380 164 L250 190" fill="none" stroke="#e2ba68" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="18" y="310" fill="#d8e0e3" font-family="Arial, sans-serif" font-size="13">sword in foreground / witnesses stay out of range</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e2ba68"/>
    </marker>
  </defs>
</svg>
