  candidates_v4: 已按问题修正生成的第四轮候选图，需要人工审片后决定是否选用
  concept_v2: 已生成第二轮细化概念图，可作为主参考继续深化
  candidates_youth_beauty_v2: 已按年轻化与美化规范生成并同步 selected
  candidates_robust_v2: 已按体格/轮廓反馈强化并同步 selected
  candidates_twin_tail_fix_v2: 已按官方发型反馈修正并同步 selected
  candidates_youth18_2026-07-18: 已按学院篇统一 18 岁视觉年龄重生并同步 selected
global_rules:
  casting_aesthetic:
    priority: 身份锚点第一，年轻美貌第二，写实粗粝最后
    academy_students:
    - 视觉年龄保持 16-20 岁少年少女感
    - 皮肤干净、五官精致、镜头友好，允许影视化美化
    - 通过制服、发型、饰件和姿态区分角色，不通过成熟脸、皱纹或粗糙皮肤增加戏剧性
    war_students:
    - 视觉年龄保持 20-23 岁青年感
    - 战争压力通过服装磨损、姿态、光线、场景和眼神表达
    - 禁止把战争篇处理成中年、疲惫、老态或风霜脸
    church_adults:
    - 教会成人保持优雅、干净、镜头友好
    - Rhea 为二十多岁绝美神性外观；Seteth 为精致青年/青年熟男权威感，不能老人化
    global_negative_traits:
    - middle-aged unless canonically required
    - old face
    - wrinkles
    - tired eye bags
    - harsh pores
    - weathered skin
    - gaunt face
    - matronly
    - gritty realism
    - generic medieval extra
  academy:
    age_range: 15-18
    required_traits:
    - teenage student
    - youthful face
    - soft facial features
    - officer academy uniform
    negative_traits:
    - mature adult
    - veteran soldier
    - battle hardened
    - harsh jawline
    - heavy wrinkles
    - beard
    - stubble
    - military commander
  war:
    age_range: 20-23
    required_traits:
    - same identity anchors as academy version
    - more mature posture
    - faction-specific wartime costume
    - visible effect of five years of conflict
